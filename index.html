<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文段考練習 - Unit 4</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        h1 {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 40px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        .btn-warning {
            background-color: #f39c12;
            color: white;
        }
        .btn-info {
            background-color: #17a2b8;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .question {
            margin-bottom: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .option {
            padding: 10px 15px;
            background-color: #ecf0f1;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            background-color: #d6dbdf;
        }
        .option.selected {
            background-color: #3498db;
            color: white;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }
        .progress-bar {
            height: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.5s;
        }
        .tab-container {
            margin: 20px 0;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
        }
        .tab.active {
            background-color: white;
            border-bottom: 1px solid white;
            margin-bottom: -1px;
        }
        .tab-content {
            display: none;
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }
        .tab-content.active {
            display: block;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            padding: 15px;
            background-color: #e8f4fc;
            border-radius: 5px;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 120px;
            margin: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
        .hidden {
            display: none;
        }
        .review-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
        }
        .flashcard {
            width: 300px;
            height: 200px;
            margin: 20px auto;
            perspective: 1000px;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .flashcard-front {
            background-color: #3498db;
            color: white;
        }
        .flashcard-back {
            background-color: #f8f9fa;
            color: #333;
            transform: rotateY(180deg);
        }
        .flashcard-word {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .flashcard-controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .points-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #2ecc71;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: bold;
            z-index: 100;
        }
        .audio-btn {
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        .exercise-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .exercise-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .exercise-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .reward-message {
            position: fixed;
            top: 80px;
            right: 20px;
            background-color: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000;
            display: none;
            animation: fadeInOut 1.5s ease-in-out;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            60% { opacity: 1; }
            100% { opacity: 0; }
        }
        .hint {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }
        .chinese-prompt {
            color: #e74c3c;
            font-weight: bold;
            margin-left: 5px;
        }
        .round-complete {
            text-align: center;
            padding: 20px;
            background-color: #d4edda;
            border-radius: 8px;
            margin: 20px 0;
        }
        .new-round-btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .more-practice-btn {
            background-color: #f39c12;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .correct-answer {
            color: #e74c3c;
            font-weight: bold;
            margin-left: 10px;
        }
        .cloze-blank {
            display: inline-block;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="points-display" id="points-display">積分: 0</div>
    <div class="reward-message" id="reward-message">+10 積分!</div>
    
    <div class="container">
        <h1>英文段考練習 - Unit 4</h1>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="learned-count">0</div>
                <div>已學會</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="practice-count">0</div>

            </div>
            <div class="stat-item">
                <div class="stat-value" id="points-count">0</div>
                <div>總積分</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress" id="progress-bar"></div>
        </div>
        
        <div class="tab-container">
            <div class="tabs">
                <div class="tab active" data-tab="vocab">單字練習</div>
                <div class="tab" data-tab="pronunciation">發音練習</div>
                <div class="tab" data-tab="grammar">文法練習</div>

            <!-- 單字練習 -->

                    <div id="vocab-round-info">
                        <p>目前回合進度: <span id="round-progress">0/0</span></p>
                        <p>剩餘單字: <span id="remaining-words">0</span></p>
                    </div>
                    
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <div class="flashcard-word" id="card-meaning-front">中文意思</div>
                                <p>點擊翻轉查看英文單字</p>
                            </div>
                            <div class="flashcard-back">
                                <div class="flashcard-word" id="card-word-back">英文單字</div>
                                <div id="card-pronunciation">發音</div>
                                <div id="card-part">詞性</div>
                                <button class="audio-btn" id="audio-btn">🔊</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flashcard-controls">
                        <button class="btn btn-success" id="btn-learned">已學會</button>
                        <button class="btn btn-danger" id="btn-practice">需練習</button>
                    </div>
                    
                    <div id="round-complete-message" class="round-complete hidden">
                        <h3>恭喜！您已完成本回合練習！</h3>
                        <p>所有單字都已標記為"已學會"</p>
                        <button class="new-round-btn" id="new-round-btn">開始新回合</button>
                    </div>
                </div>
            </div>
            
            <!-- 發音練習 -->
            <div class="tab-content" id="pronunciation">
                <div class="section">
                    <h2>發音對比練習</h2>
                    <p>請選擇你聽到的發音：</p>
                    <div class="exercise-container" id="pronunciation-questions">
                        <!-- 發音題目將通過JavaScript動態生成 -->
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" id="check-pronunciation">檢查答案</button>
                        <button class="more-practice-btn" id="new-pronunciation">更多練習</button>
                    </div>
                </div>
            </div>
            
            <!-- 文法練習 -->
            <div class="tab-content" id="grammar">
                <div class="section">
                    <h2>現在分詞填空</h2>
                    <div id="gerund-questions">
                        <!-- 現在分詞題目將通過JavaScript動態生成 -->
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" id="check-gerund">檢查答案</button>
                        <button class="more-practice-btn" id="new-gerund">更多練習</button>
                    </div>
                </div>
                
                <div class="section">
                    <h2>人稱代名詞填空</h2>
                    <div id="pronoun-questions">

                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" id="check-pronoun">檢查答案</button>
                        <button class="more-practice-btn" id="new-pronoun">更多練習</button>
                    </div>
                </div>
            </div>
            
            <!-- 克漏字填空 -->
            <div class="tab-content" id="cloze">
                <div class="section">
                    <h2>克漏字綜合練習</h2>
                    <p>請填入適當的單字或詞組：</p>
                    <div id="cloze-passage">
                        <!-- 克漏字段落將通過JavaScript動態生成 -->
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" id="check-cloze">檢查答案</button>

                    </div>
                </div>
            </div>

            <div class="tab-content" id="review">

                    <div id="review-items">

                    </div>
                </div>
            </div>
        </div>
    </div>

        // 顯示卡片
        function showCard(vocabList, index) {
            const word = vocabList[index];
            document.getElementById('card-meaning-front').textContent = word.meaning;
            document.getElementById('card-word-back').textContent = word.word;
            document.getElementById('card-pronunciation').textContent = word.pronunciation;
            document.getElementById('card-part').textContent = word.partOfSpeech;
            
            // 重置卡片狀態
            document.getElementById('flashcard').classList.remove('flipped');
        }

        // 下一張卡片
        function nextCard(vocabList) {
            // 如果還有需要練習的單字，優先顯示
            if (practiceInRound.length > 0) {
                const nextPracticeWord = practiceInRound[0];
                const practiceIndex = vocabList.findIndex(word => word.word === nextPracticeWord);
                if (practiceIndex !== -1) {
                    currentCardIndex = practiceIndex;
                } else {
                    // 如果找不到，從練習列表中移除
                    practiceInRound.shift();
                    currentCardIndex = findNextUnlearnedWord(vocabList);
                }
            } else {
                currentCardIndex = findNextUnlearnedWord(vocabList);
            }
            
            // 如果所有單字都已學會，顯示完成消息
            if (currentCardIndex === -1) {
                document.getElementById('round-complete-message').classList.remove('hidden');
                addPoints(10);
                return;
            }
            
            showCard(vocabList, currentCardIndex);
            updateRoundInfo();
        }

        // 查找下一個未學會的單字
        function findNextUnlearnedWord(vocabList) {
            // 從當前位置開始尋找下一個未學會的單字
            for (let i = 1; i <= vocabList.length; i++) {
                const index = (currentCardIndex + i) % vocabList.length;
                if (!learnedInRound.includes(vocabList[index].word)) {
                    return index;
                }
            }
            
            return -1; // 所有單字都已學會
        }

            const totalWords = currentRoundWords.length;
            const learnedCount = learnedInRound.length;
            const remainingCount = totalWords - learnedCount;
            
            document.getElementById('round-progress').textContent = `${learnedCount}/${totalWords}`;
            document.getElementById('remaining-words').textContent = remainingCount;
        }

        // 標記單字為已學會
        function markWordAsLearned(word) {
            if (!learnedInRound.includes(word)) {
                learnedInRound.push(word);
                
                // 從需練習列表中移除
                const practiceIndex = practiceInRound.indexOf(word);
                if (practiceIndex !== -1) {
                    practiceInRound.splice(practiceIndex, 1);
                }
                
                // 更新全局學習狀態
                let learnedWords = JSON.parse(localStorage.getItem('learnedWords')) || [];
                if (!learnedWords.includes(word)) {
                    learnedWords.push(word);
                    localStorage.setItem('learnedWords', JSON.stringify(learnedWords));
                }
                
                let practiceWords = JSON.parse(localStorage.getItem('practiceWords')) || [];
                practiceWords = practiceWords.filter(w => w !== word);
                localStorage.setItem('practiceWords', JSON.stringify(practiceWords));
                
                updateStats();
                updateReviewItems();
                addPoints(2);
            }
        }

                updateStats();

                const feedback = document.getElementById(`feedback-pronunciation-${question.id}`);
                
                if (selectedOption) {
                    const selectedIndex = parseInt(selectedOption.getAttribute('data-option'));
                    
                    if (selectedIndex === question.correct) {
                        feedback.textContent = "✓ 正確！";
                        feedback.className = "feedback correct";
                        correctCount++;
                    } else {
                        feedback.textContent = `✗ 不正確。正確答案是：${question.options[question.correct]}`;
                        feedback.className = "feedback incorrect";
                    }
                    feedback.style.display = 'block';

                    feedback.textContent = "請選擇一個答案。";
                    feedback.className = "feedback incorrect";
                    feedback.style.display = 'block';

        // 生成克漏字練習
        function generateClozeExercise() {
            const clozeContainer = document.getElementById('cloze-passage');
            clozeContainer.innerHTML = '';
            
            // 隨機選擇一個克漏字段落
            currentClozePassage = clozePassages[Math.floor(Math.random() * clozePassages.length)];
            
            let passageHTML = '<p>';
            const words = currentClozePassage.text.split(' ');
            let blankIndex = 0;
            
            words.forEach(word => {
                if (word === '______') {
                    const blank = currentClozePassage.blanks[blankIndex];
                    const answerWords = blank.answer.split(' ');
                    
                    for (let i = 0; i < answerWords.length; i++) {
                        passageHTML += `<input type="text" id="cloze-answer-${blank.id}-${i}" placeholder="填入答案" style="width: ${answerWords.length > 1 ? '80px' : '120px'}; margin: 0 2px;" class="cloze-blank"> `;
                    }
                    blankIndex++;
                } else {
                    passageHTML += word + ' ';
                }
            });
            
            passageHTML += '</p>';
            clozeContainer.innerHTML = passageHTML;
        }

        // 檢查克漏字練習答案
        function checkClozeAnswers() {
            let correctCount = 0;
            
            currentClozePassage.blanks.forEach(blank => {
                const answerWords = blank.answer.split(' ');
                let blankCorrect = true;
                
                for (let i = 0; i < answerWords.length; i++) {
                    const answerInput = document.getElementById(`cloze-answer-${blank.id}-${i}`);
                    const userAnswer = answerInput.value.trim().toLowerCase();
                    
                    if (userAnswer === answerWords[i].toLowerCase()) {
                        answerInput.style.backgroundColor = '#d4edda';
                    } else {
                        answerInput.style.backgroundColor = '#f8d7da';
                        blankCorrect = false;
                    }
                }
                
                if (blankCorrect) {
                    correctCount++;
                }
            });
            
            // 顯示總體結果並獎勵積分
            const earnedPoints = Math.floor(correctCount * 2);
            addPoints(earnedPoints);
            alert(`克漏字練習完成！\n正確: ${correctCount}/${currentClozePassage.blanks.length}\n獲得 ${earnedPoints} 積分`);
        }

        // 公布克漏字答案
        function showClozeAnswers() {
            currentClozePassage.blanks.forEach(blank => {
                const answerWords = blank.answer.split(' ');
                
                for (let i = 0; i < answerWords.length; i++) {
                    const answerInput = document.getElementById(`cloze-answer-${blank.id}-${i}`);
                    const userAnswer = answerInput.value.trim().toLowerCase();
                    
                    if (userAnswer !== answerWords[i].toLowerCase()) {
                        answerInput.style.backgroundColor = '#f8d7da';
                        // 在輸入框後面顯示正確答案
                        const correctAnswerSpan = document.createElement('span');
                        correctAnswerSpan.className = 'correct-answer';
                        correctAnswerSpan.textContent = `正確答案: ${answerWords[i]}`;
                        answerInput.parentNode.insertBefore(correctAnswerSpan, answerInput.nextSibling);
                    } else {
                        answerInput.style.backgroundColor = '#d4edda';
                    }
                }
            });
        }

            const reviewContainer = document.getElementById('review-items');
            reviewContainer.innerHTML = '';
            
            const practiceWords = JSON.parse(localStorage.getItem('practiceWords')) || [];
            
            if (practiceWords.length === 0) {
                reviewContainer.innerHTML = '<p>目前沒有需要複習的項目。繼續保持！</p>';
                return;
            }
            
            const practiceList = document.createElement('ul');
            practiceWords.forEach(word => {
                const wordItem = document.createElement('li');
                wordItem.textContent = word;
                practiceList.appendChild(wordItem);
            });
            
            reviewContainer.appendChild(practiceList);
        }

        // 添加積分
        function addPoints(amount) {
            points += amount;
            localStorage.setItem('points', points.toString());
            updatePointsDisplay();
            
            // 顯示積分獎勵消息
            const rewardMessage = document.getElementById('reward-message');
            rewardMessage.textContent = `+${amount} 積分!`;
            rewardMessage.style.display = 'block';
            
            setTimeout(() => {
                rewardMessage.style.display = 'none';
            }, 1500);
        }

        // 更新積分顯示
        function updatePointsDisplay() {
            document.getElementById('points-display').textContent = `積分: ${points}`;
            document.getElementById('points-count').textContent = points;
        }
    </script>
</body>
</html>
